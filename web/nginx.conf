server {
    listen 80;
    # Traefik (Dokploy) route déjà par nom d'hôte : le conteneur répond à tout.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans les en-têtes et pages d'erreur
    server_tokens off;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        image/svg+xml;
    # Les .woff2 sont déjà compressés : les repasser en gzip ne gagnerait rien.

    include /etc/nginx/snippets/security-headers.conf;

    # ------------------------------------------------------------------
    # Cache
    #
    # Chaque location qui pose un `add_header` doit ré-inclure les en-têtes de
    # sécurité : nginx n'hérite pas des `add_header` du niveau supérieur dès
    # qu'un bloc en définit un.
    # ------------------------------------------------------------------

    # Fichiers à empreinte : le nom change à chaque build, on peut figer un an.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Le point d'entrée ne doit jamais être servi depuis un cache périmé, sinon
    # le navigateur réclame des fichiers /assets/ qui n'existent plus.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Routage SPA
    #
    # Le bloc `location /api/` précédent renvoyait vers le domaine public du
    # front lui-même : la requête rebouclait sur ce conteneur. Il est supprimé —
    # le navigateur appelle l'API directement via VITE_API_URL, le CORS étant
    # géré côté Symfony.
    # ------------------------------------------------------------------
    #
    # Seules les routes déclarées dans src/router.js reçoivent l'application
    # avec un statut 200. Toute autre URL renvoie un vrai 404 HTTP (le corps
    # reste l'application, qui affiche sa page « introuvable ») : les robots et
    # les outils de liens cassés voient enfin l'erreur. À tenir synchronisé avec
    # le routeur lors de l'ajout d'une page.
    # ------------------------------------------------------------------
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~ ^/(movies|actors|categories|directors|mentions-legales|confidentialite)(/[^/]+)?/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Pages privées ou sans valeur pour l'index : en plus de la balise meta
    # robots posée par le routeur, l'en-tête couvre les robots sans JavaScript.
    # (Ce n'est pas un contrôle d'accès : l'API autorise ou refuse seule.)
    location ~ ^/(connexion|inscription|profile|admin|500)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # Sonde de vivacité, interrogée par le HEALTHCHECK du conteneur
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rien à exposer ici : ni fichier caché, ni source
    location ~ /\. {
        deny all;
    }
}
