# ---------------------------------------------------------------------------
# En-têtes de sécurité, dans un fichier à part et volontairement inclus dans
# CHAQUE bloc location qui définit ses propres `add_header`.
#
# Raison : en nginx, dès qu'un bloc contient un `add_header`, il n'hérite plus
# d'aucun `add_header` du niveau supérieur. Sans cette inclusion, /index.html
# — le document qui exécute le code — perdrait sa CSP et son X-Frame-Options
# parce qu'il définit un Cache-Control.
#
# HSTS est absent : c'est Traefik qui termine le TLS côté Dokploy, l'en-tête
# se règle donc là-bas (nginx ne voit ici que du HTTP en interne).
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Politique de sécurité du contenu.
#   - script-src 'self' : aucun script en ligne ni CDN ; le build Vite ne
#     produit que des modules externes.
#   - style-src 'unsafe-inline' : requis par les styles que Vue applique en
#     attribut (animations d'apparition, barre de progression de lecture).
#   - img-src https: : les affiches proviennent d'URL arbitraires stockées en
#     base ; à resserrer sur le domaine des médias si elles y sont rapatriées.
#   - connect-src / script-src : __API_ORIGIN__ et __ANALYTICS_ORIGIN__ sont
#     remplacés AU BUILD (Dockerfile) par l'origine de VITE_API_URL et, si une
#     mesure d'audience est configurée, par celle de VITE_ANALYTICS_SRC (vide
#     sinon). La CSP suit ainsi le bundle réellement construit.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __ANALYTICS_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' __API_ORIGIN__ __ANALYTICS_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
