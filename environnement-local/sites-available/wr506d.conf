# Vhost local de l'API Symfony (image mmi3docker/symfony-2024, port 8319).
<VirtualHost *:80>
    DocumentRoot /var/www/html/wr506d/public
    <Directory /var/www/html/wr506d/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    <Directory /var/www/html/wr506d/public/media>
        php_admin_flag engine off
        Options -ExecCGI -Indexes
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/wr506d-error.log
    CustomLog ${APACHE_LOG_DIR}/wr506d-access.log combined
</VirtualHost>
