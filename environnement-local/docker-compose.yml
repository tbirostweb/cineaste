version: '3.8'

services:
  web:
    image: mmi3docker/symfony-2024
    container_name: symfony-web-2025
    hostname: symfony-web
    restart: always
    ports:
      - "8319:80"
    depends_on:
      - db
    volumes:
      - ./www/:/var/www/
      - ./www/html/Clicker-Game/Backend/:/var/www/game-backend/
      - ./sites/:/etc/apache2/sites-enabled/
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data

  db:
    image: mariadb:10.8
    container_name: symfony-db-2025
    hostname: symfony-db
    restart: always
    volumes:
      - db-volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: PASSWORD
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: PASSWORD

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: symfony-adminsql-2025
    hostname: symfony-adminsql
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: PASSWORD
      MYSQL_USER: symfony
      MYSQL_PASSWORD: PASSWORD

  maildev:
    image: maildev/maildev
    container_name: symfony-mail-2025
    hostname: symfony-mail
    command: bin/maildev --web 1080 --smtp 1025 --hide-extensions STARTTLS
    restart: always
    ports:
      - "1080:1080"

volumes:
  db-volume: