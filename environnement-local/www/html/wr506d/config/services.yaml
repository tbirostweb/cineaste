# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Cookie de session (JWT HttpOnly). Secure par défaut ; JWT_COOKIE_SECURE=0
    # uniquement pour un poste de développement en HTTP non-localhost.
    env(JWT_COOKIE_SECURE): '1'
    # Strict : le front (generique.theo-birost.fr) et l'API (wr506.theo-birost.fr)
    # sont sur le même site ; aucun besoin d'envoyer le cookie cross-site.
    env(JWT_COOKIE_SAMESITE): 'strict'
    # Proxys de confiance (Traefik/Dokploy) pour lire la vraie IP cliente.
    env(TRUSTED_PROXIES): '127.0.0.1'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    app.Slugify:
        class: App\Service\Slugify

    App\EventSubscriber\ApiRateLimitSubscriber:
        arguments:
            $anonymousApiLimiter: '@limiter.anonymous_api'
            $authenticatedApiLimiter: '@limiter.authenticated_api'
            $registrationLimiter: '@limiter.registration'
            $rateLimiterStorage: '@app.rate_limiter_storage'

    # Stockage commun des limiteurs créés à la volée (plafond propre au compte).
    app.rate_limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\CacheStorage
        arguments: ['@cache.rate_limiter']

    App\EventSubscriber\UploadQuotaSubscriber:
        arguments:
            $uploadCountLimiter: '@limiter.media_upload_count'
            $uploadVolumeLimiter: '@limiter.media_upload_volume'

    App\Security\AuthCookieManager:
        arguments:
            $secure: '%env(bool:JWT_COOKIE_SECURE)%'
            $sameSite: '%env(JWT_COOKIE_SAMESITE)%'
            $ttl: '%lexik_jwt_authentication.token_ttl%'

    App\Controller\TwoFactorController:
        arguments:
            $twoFactorLimiter: '@limiter.two_factor'

    App\EventListener\UserPasswordListener:
        tags:
            - { name: doctrine.orm.entity_listener, event: prePersist, entity: App\Entity\User }

    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }

    Faker\Generator:
        factory: ['Faker\Factory', 'create']
        arguments: ['fr_FR']
